<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada — Step Her Up</title>
<noscript><style>body{visibility:visible !important}</style></noscript>
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    visibility:hidden; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
    background:linear-gradient(160deg, #4a1624, #0d0304); color:#f7ece9;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .card{
    width:100%; max-width:380px; text-align:center; padding:30px 26px; border-radius:18px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
  }
  h1{ margin:0 0 10px; font-family:Georgia, "Times New Roman", serif; font-size:24px; font-weight:600; }
  p{ margin:0 0 20px; font-size:14.5px; line-height:1.55; color:rgba(247,236,233,0.75); }
  a.btn{
    display:inline-block; padding:12px 24px; border-radius:999px; font-weight:700; font-size:14px;
    text-decoration:none; color:#2a0a13; background:linear-gradient(90deg, #e88aa8, #f0a8be);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>No encontramos esa página</h1>
    <p>El link puede estar mal escrito o incompleto. Pedí que te lo vuelvan a enviar y abrilo copiándolo y pegándolo, sin escribirlo a mano.</p>
    <a class="btn" id="inicio" href="/step-her-up/">Ir al inicio</a>
  </div>
<script>
  (function(){
    var base = '/step-her-up/';
    var path = location.pathname;
    var rest = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
    var slug = rest.replace(/\/+$/, '').replace(/\.html?$/i, '').toLowerCase();
    var paginas = ['dashboard', 'formulario', 'gracias', 'testimonios', 'calendario', 'propuesta', 'webinar'];
    var destino = null;
    if(paginas.indexOf(slug) > -1) destino = slug;
    else if(slug === 'index' || slug === '') destino = '';
    else if(/^dash/.test(slug)) destino = 'dashboard';
    if(destino !== null && base + destino !== path){
      location.replace(base + destino + location.search + location.hash);
      return;
    }
    document.body.style.visibility = 'visible';
  })();
</script>
</body>
</html>
