<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital@1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-1:#1a0509; --wine-2:#3d0f1f; --wine-3:#5a1626;
    --blush:#f0a8be; --blush-2:#e88aa8;
    --cream:#f7ece9; --text-dim:rgba(247,236,233,0.72);
    --card:rgba(255,255,255,0.06); --border:rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  /* Fondo degradé borgoña ÚNICO para toda la página — fixed, para que no
     se corte ni se note la costura al pasar de una sección a la otra. */
  body{
    margin:0; color:var(--cream);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
    background:
      radial-gradient(ellipse 1100px 700px at 82% 0%, rgba(90,22,38,0.5), transparent 55%),
      radial-gradient(ellipse 900px 600px at 15% 60%, rgba(90,22,38,0.35), transparent 55%),
      linear-gradient(180deg, var(--wine-2) 0%, var(--wine-1) 40%);
    background-attachment:fixed;
  }
  .wrap{ max-width:1320px; margin:0 auto; padding:0 24px; }
  h1,h2,h3{ font-family:"Playfair Display", Georgia, serif; margin:0; }
  a{ color:inherit; }

  /* ===== Header / logo (isotipo estrella + wordmark Step·HER·Up) ===== */
  header.top{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:28px 0 8px; }
  .logo-img{ height:130px; width:auto; display:block; }

  /* ===== Hero ===== */
  .hero{ padding:20px 0 10px; position:relative; overflow:hidden; }
  .hero-grid{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center; }
  .hero h1{ font-size:40px; line-height:1.18; font-weight:600; letter-spacing:-0.3px; }
  .hero h1 .hl{ color:var(--blush); }
  .hero .cta-wrap{ margin:30px 0 26px; }
  .btn{
    display:inline-flex; align-items:center; gap:10px; padding:22px 48px; border-radius:999px;
    font-weight:700; font-size:19px; text-decoration:none; cursor:pointer; border:1px solid var(--blush-2);
    background:transparent; color:var(--cream); transition:background .2s ease, transform .15s ease, opacity .2s ease, filter .2s ease;
  }
  .btn:hover{ background:rgba(240,168,190,0.12); transform:translateY(-1px); }
  .btn-solid{ background:linear-gradient(90deg,var(--blush-2),var(--blush)); color:#2a0a13; border:none; box-shadow:0 10px 30px rgba(232,138,168,0.3); }
  .btn-solid:hover{ box-shadow:0 14px 36px rgba(232,138,168,0.45); }

  /* ===== Botón "Aplicar al programa" — el texto nunca cambia; el BOTÓN
     ENTERO es la animación de carga: se va rellenando de color de
     izquierda a derecha a medida que "avanza" el video (como una barra de
     carga, pero es el botón mismo, no una franja chica adentro). Al
     llegar al 100% queda igual al botón final ya desbloqueado. ===== */
  .btn-cta{
    position:relative; overflow:hidden; padding:26px 56px; font-size:21px;
    background:var(--card); border:1px solid var(--blush-2); color:var(--cream);
  }
  .btn-cta .cta-label{ position:relative; z-index:2; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
  .btn-cta:not(.locked) .cta-label{ text-shadow:none; }
  .btn-cta .cta-fill{
    position:absolute; top:0; left:0; bottom:0; width:0%; z-index:1;
    background:var(--blush);
  }
  .btn-cta.locked{ cursor:not-allowed; pointer-events:none; animation:cta-breathe 2.4s ease-in-out infinite; }
  .btn-cta:not(.locked){
    color:#2a0a13; border-color:transparent; box-shadow:0 10px 30px rgba(232,138,168,0.35);
    animation:none;
  }
  .btn-cta:not(.locked):hover{ box-shadow:0 14px 36px rgba(232,138,168,0.5); }
  /* Al desbloquear: un "pop" único (cta-pulse) y, apenas termina, un
     glow que respira en loop (cta-glow) para que el botón siga llamando
     la atención hasta que lo toquen. */
  .btn-cta.just-unlocked{ animation:cta-pulse .7s ease, cta-glow 1.8s ease-in-out 0.7s infinite; }
  @keyframes cta-breathe{ 0%,100%{ opacity:1; } 50%{ opacity:0.85; } }
  @keyframes cta-pulse{
    0%{ transform:scale(1); box-shadow:0 10px 30px rgba(232,138,168,0.3); }
    45%{ transform:scale(1.07); box-shadow:0 0 0 14px rgba(240,168,190,0.22); }
    100%{ transform:scale(1); box-shadow:0 10px 30px rgba(232,138,168,0.3); }
  }
  @keyframes cta-glow{
    0%,100%{ transform:scale(1); box-shadow:0 10px 30px rgba(232,138,168,0.35), 0 0 0 0 rgba(240,168,190,0.4); }
    50%{ transform:scale(1.035); box-shadow:0 10px 34px rgba(232,138,168,0.55), 0 0 0 12px rgba(240,168,190,0); }
  }
  .hero .checklist{ margin:0; padding:0; list-style:none; font-size:15px; color:var(--text-dim); }
  .hero .checklist li{ padding:5px 0; }
  .hero .checklist li::before{ content:"• "; color:var(--blush); }
  .hero-label{ font-size:12.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--blush); margin-bottom:14px; }

  .hero-photo{
    aspect-ratio:3/4; border-radius:20px; position:relative; overflow:hidden;
    background:linear-gradient(160deg, var(--wine-3), var(--wine-1));
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
  }
  .hero-photo .placeholder-label{ color:var(--text-dim); font-size:13px; text-align:center; padding:0 20px; }

  @media (max-width:760px){
    .hero-grid{ grid-template-columns:1fr; }
    .hero h1{ font-size:30px; }
    .hero-photo{ aspect-ratio:16/10; order:-1; }
  }

  /* ===== Sección genérica con título centrado ===== */
  .section{ padding:70px 0; }
  .section-head{ text-align:center; max-width:620px; margin:0 auto 44px; }
  .section-head .eyebrow{ font-size:12.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--blush); margin-bottom:10px; }
  .section-head h2{ font-size:32px; font-weight:600; }
  .section-head h2 .hl{ color:var(--blush); font-style:italic; }

  /* ===== VSL ===== */
  .vsl-card{
    max-width:1100px; margin:0 auto; border-radius:18px; overflow:hidden;
    border:1px solid var(--border); background:var(--card);
  }
  .vsl-video{
    aspect-ratio:16/9; position:relative; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--wine-3), #0d0304);
  }
  .vsl-video:fullscreen, .vsl-video:-webkit-full-screen{
    aspect-ratio:auto; width:100vw; height:100vh; background:#000;
  }
  .vsl-video video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; background:#000; cursor:pointer; }
  .vsl-play{
    position:relative; z-index:1;
    width:88px; height:88px; border-radius:50%;
    background:linear-gradient(135deg,var(--blush-2),var(--blush)); color:#2a0a13;
    display:flex; align-items:center; justify-content:center; font-size:32px; cursor:pointer;
    box-shadow:0 8px 34px rgba(232,138,168,0.55);
    animation:vsl-play-pulse 1.6s ease-in-out infinite;
  }
  .vsl-play::before, .vsl-play::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:2.5px solid var(--blush); opacity:0; pointer-events:none;
    animation:vsl-play-ring 1.8s ease-out infinite;
  }
  .vsl-play::after{ animation-delay:0.6s; }
  @keyframes vsl-play-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  @keyframes vsl-play-ring{
    0%{ transform:scale(1); opacity:0.7; }
    100%{ transform:scale(2.1); opacity:0; }
  }
  /* Controles propios estilo SHU: la barra rosa es el "piso" del video
     (pegada al borde inferior) y encima, en la misma franja, quedan
     mute/velocidad/pantalla completa — nada más (sin botón de pausa ni
     reloj: el video se pausa tocándolo directamente). No muestra
     números — el avance visual usa un easing (rápido al principio, más
     lento después) aunque el % real siga el tiempo real del video 1 a
     1. La barra no es arrastrable a propósito: evita que se salteen el
     video para desbloquear el botón sin verlo. */
  .vsl-controls{
    position:absolute; left:0; right:0; bottom:0; z-index:3;
    display:none; align-items:center; justify-content:flex-end; gap:4px; padding:10px 8px 12px;
    background:linear-gradient(0deg, rgba(13,3,4,0.95), rgba(13,3,4,0.8) 70%, transparent);
    pointer-events:none;
  }
  .vsl-controls > *{ pointer-events:auto; }
  .vsl-video.started .vsl-controls{ display:flex; }
  .vsl-progress{
    position:absolute; left:0; right:0; bottom:0; height:4px; z-index:1;
    background:rgba(255,255,255,0.18);
  }
  .vsl-progress-fill{
    height:100%; width:0%; background:linear-gradient(90deg,var(--blush-2),var(--blush));
  }
  .vsl-ctrl-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:transparent; color:var(--cream);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; padding:0;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .vsl-ctrl-btn:hover{ background:rgba(255,255,255,0.14); color:var(--blush); }
  .vsl-ctrl-btn svg{ width:18px; height:18px; display:block; }
  .vsl-speed{ position:relative; }
  .vsl-speed-btn{ width:auto; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:700; }
  .vsl-speed-menu{
    position:absolute; bottom:42px; right:0; background:var(--wine-2); border:1px solid var(--border);
    border-radius:12px; padding:6px; display:none; flex-direction:column; min-width:84px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .vsl-speed-menu.open{ display:flex; }
  .vsl-speed-menu button{
    background:none; border:none; color:var(--cream); font-size:13px; padding:7px 10px; border-radius:8px;
    text-align:left; cursor:pointer;
  }
  .vsl-speed-menu button:hover{ background:rgba(255,255,255,0.08); }
  .vsl-speed-menu button.active{ color:var(--blush); font-weight:700; }

  /* ===== Calendario ===== */
  .calendar-card{
    max-width:520px; margin:0 auto; border-radius:18px; border:1px solid var(--border);
    background:var(--card); padding:30px;
  }
  .calendar-placeholder{
    border:1.5px dashed var(--border); border-radius:14px; padding:50px 20px; text-align:center;
    color:var(--text-dim); font-size:14px;
  }
  .calendar-placeholder b{ display:block; color:var(--cream); font-size:15px; margin-bottom:6px; }

  /* ===== Formulario ===== */
  .form-card{
    max-width:460px; margin:0 auto; border-radius:18px; border:1px solid var(--border);
    background:var(--card); padding:34px;
  }
  .form-card h3{ font-size:22px; text-align:center; margin-bottom:8px; }
  .form-card .sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:24px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border);
    background:rgba(0,0,0,0.25); color:var(--cream); font-size:14.5px; font-family:inherit;
  }
  .field input::placeholder{ color:rgba(247,236,233,0.4); }
  .phone-row{ display:flex; gap:8px; }
  .phone-row select{ flex:0 0 110px; }
  .form-card .btn-solid{ width:100%; justify-content:center; margin-top:6px; }
  .form-fineprint{ text-align:center; font-size:11.5px; color:var(--text-dim); margin-top:14px; }

  /* ===== Encuesta previa al VSL — se despliega al tocar play, antes de
     arrancar el video/cronómetro. Reusa las clases .form-card/.field/
     .phone-row de arriba. ===== */
  .vsl-gate-overlay{
    position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
    padding:20px; background:rgba(10,2,4,0.72); backdrop-filter:blur(6px);
  }
  .vsl-gate-overlay.open{ display:flex; }
  .vsl-gate-card{
    position:relative; width:100%; box-shadow:0 30px 70px rgba(0,0,0,0.5);
    animation:vsl-gate-in .25s ease;
    background:#2b0b15; border-color:rgba(255,255,255,0.16);
  }
  @keyframes vsl-gate-in{ from{ opacity:0; transform:translateY(12px) scale(0.97); } to{ opacity:1; transform:none; } }
  .vsl-gate-close{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--cream);
    cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .vsl-gate-close:hover{ background:rgba(255,255,255,0.16); }

  /* ===== Features (4 bullets) ===== */
  .features{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; max-width:820px; margin:0 auto; }
  .feature-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:26px;
    display:flex; gap:16px; align-items:flex-start;
  }
  .feature-ic{
    width:42px; height:42px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, rgba(240,168,190,0.25), rgba(240,168,190,0.05)); font-size:19px;
  }
  .feature-card p{ margin:0; font-size:14.5px; color:var(--text-dim); }
  @media (max-width:640px){ .features{ grid-template-columns:1fr; } }

  /* ===== Quién es Gianie ===== */
  .about-grid{ display:grid; grid-template-columns:1.3fr 0.7fr; gap:44px; align-items:center; max-width:920px; margin:0 auto; }
  .about-photo{
    aspect-ratio:4/5; object-fit:cover; display:block; border-radius:16px;
    filter:drop-shadow(0 20px 50px rgba(0,0,0,0.45));
  }
  .about-photo-sm{ max-width:320px; margin:0 0 0 auto; }
  .about-grid p{ color:var(--text-dim); font-size:15px; }
  .about-grid p b{ color:var(--cream); }
  @media (max-width:700px){ .about-grid{ grid-template-columns:1fr; } .about-photo-sm{ margin:0 auto; } }


  /* ===== Carrusel de capturas (auto, dinámico) ===== */
  .carousel{ max-width:900px; margin:0 auto; overflow:hidden; }
  .carousel-track{
    display:flex; gap:18px; transition:transform .6s cubic-bezier(.65,0,.35,1); will-change:transform;
    cursor:grab; touch-action:pan-y; user-select:none;
  }
  .carousel-track:active{ cursor:grabbing; }
  .carousel-slide{
    flex:0 0 calc((100% - 36px)/3); aspect-ratio:369/705; border-radius:14px;
    background:linear-gradient(160deg, var(--wine-3), var(--wine-1)); border:1px solid var(--border);
    overflow:hidden; touch-action:pan-y;
  }
  .carousel-slide img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .carousel-caption{ text-align:center; color:var(--text-dim); font-size:12px; margin-top:18px; }
  @media (max-width:900px){ .carousel-slide{ flex-basis:calc((100% - 18px)/2); } }
  @media (max-width:600px){ .carousel-slide{ flex-basis:100%; } }

  /* ===== Reseñas estilo Google (tarjetas claras, a propósito distintas
     del resto de la página oscura — para que se lean como prueba social
     "externa", igual que un widget de reseñas embebido) ===== */
  .reviews-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; max-width:1240px; margin:0 auto; }
  .review-card{
    background:#fff; border-radius:16px; padding:22px; display:flex; flex-direction:column; gap:12px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }
  .review-stars{ color:#fbbc04; font-size:16px; letter-spacing:2px; }
  .review-text{ color:#3c3c3c; font-size:14.5px; line-height:1.55; margin:0; flex:1; }
  .review-author{ display:flex; align-items:center; gap:10px; }
  .review-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--blush-2), var(--blush)); color:#2a0a13;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
  }
  .review-name{ font-size:13.5px; font-weight:700; color:#1a1a1a; }
  .review-source{ font-size:11.5px; color:#767676; }
  @media (max-width:900px){ .reviews-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .reviews-grid{ grid-template-columns:1fr; } }

  /* ===== Footer ===== */
  footer{ background:#0a0203; padding:44px 0; text-align:center; }
  footer .logo-img{ margin:0 auto 16px; }
  footer p{ font-size:12px; color:var(--text-dim); max-width:640px; margin:6px auto 0; }
</style>
