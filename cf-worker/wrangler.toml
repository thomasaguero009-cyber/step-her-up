name = "step-her-up-calendar"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# El único secret real (nunca va acá, se carga con
# `npx wrangler secret put GHL_API_KEY`): el token "pit-..." de la Private
# Integration. locationId y calendarId son identificadores, no credenciales,
# así que van como vars normales.

[vars]
# Orígenes permitidos a llamar este Worker (CORS).
ALLOWED_ORIGINS = "https://thomasaguero009-cyber.github.io,https://dash.stepherup.com,https://stepherup.com,https://www.stepherup.com,https://shu.stepherup.com,http://localhost:8934"
GHL_LOCATION_ID = "6cXs7Gwtzk0m50TZkWPg"
GHL_CALENDAR_ID = "oqdvXTW2FT1ZbOo0sio2"
# Modelo de OpenAI para las estrategias (se puede cambiar acá y volver a desplegar).
OPENAI_MODEL = "gpt-4.1"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "step-her-up-videos"

# Ejemplos reales de estrategias (privados: NO van al repo, que es público).
# Se cargan con `npx wrangler kv key put --binding=ESTRATEGIAS --remote ...`.
[[kv_namespaces]]
binding = "ESTRATEGIAS"
id = "e4cf8c7402e5449592cb0c64c7fda7ef"
